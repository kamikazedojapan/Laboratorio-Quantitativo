[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laboratorio-trading"
version = "0.1.0"
description = "Laboratório local e determinístico de backtesting intraday"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "streamlit>=1.40,<2", "plotly>=5.24,<7", "pyarrow>=18,<24", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
trading-demo = "trading_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
